include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Docs on every public member is too strict for an app (not a library).
    public_member_api_docs: false
